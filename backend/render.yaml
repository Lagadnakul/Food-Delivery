services:
  - type: web
    name: hunger-hive-backend
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: mongodb+srv://<user>:<password>@<cluster>.mongodb.net/HungerHive
      - key: JWT_SECRET
        value: random#secret
      - key: IMAGEKIT_PUBLIC_KEY
        value: <IMAGEKIT_PUBLIC_KEY>
      - key: IMAGEKIT_PRIVATE_KEY
        value: <IMAGEKIT_PRIVATE_KEY>
      - key: IMAGEKIT_URL_ENDPOINT
        value: https://ik.imagekit.io/bxi3adntf
      - key: CORS_ORIGIN
        value: https://hunger-hive-frontend.vercel.app